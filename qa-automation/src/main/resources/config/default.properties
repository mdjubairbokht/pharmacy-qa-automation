# ---------------------------------------------------------------------------
# Defaults shared by every environment. An environment file
# (config/<env>.properties) overrides these, and any key can be overridden
# again by a JVM system property (-Dkey=value) or an environment variable
# (key "db.url" -> DB_URL, "app.baseUrl" -> APP_BASE_URL).
# ---------------------------------------------------------------------------

# Application under test
app.baseUrl=http://localhost:8080
ui.baseUrl=http://localhost:8080

# Database (read-only validation + negative constraint tests)
db.url=jdbc:postgresql://localhost:5432/pharmacy
db.user=pharmacy
db.password=pharmacy

# Browser
browser=chrome
headless=false
grid.url=
timeout.explicit.seconds=10
timeout.pageLoad.seconds=30

# Flaky-test control: UI tests are retried this many times
retry.count=0

# Seeded test accounts (demo credentials only)
pharmacist.username=rph.jones
pharmacist.password=Pharm@123
technician.username=tech.smith
technician.password=Tech@123
disabled.username=locked.user
disabled.password=Locked@123

# How long the suite waits for /api/health before giving up
health.timeout.seconds=90
